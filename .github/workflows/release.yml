name: Release

run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and release
    needs: [test]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node (npm OIDC auth)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun ci

      - name: Resolve version, pre-id, and dry-run flag
        id: env
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # Extract PRE_ID from version (e.g. 0.0.1-test.1 -> test, 0.0.1-beta.1 -> beta, 0.0.1 -> latest)
          if [[ "$VERSION" == *-* ]]; then
            PRE_ID="${VERSION#*-}"   # test.1
            PRE_ID="${PRE_ID%%.*}"   # test
          else
            PRE_ID="latest"
          fi

          # Dry run when PRE_ID is test
          if [[ "$PRE_ID" == "test" ]]; then
            DRY_RUN="true"
          else
            DRY_RUN="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pre_id=$PRE_ID" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRE_ID=$PRE_ID" >> "$GITHUB_ENV"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"

      - name: Sync package.json version to tag
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Build npm bundle
        run: bun build ./src/cli.ts --outdir ./dist --target node

      - name: Cross-compile standalone binaries
        run: |
          bun build ./src/cli.ts --compile --minify --target=bun-linux-x64     --outfile betterprompt-$VERSION-linux-x64
          bun build ./src/cli.ts --compile --minify --target=bun-linux-arm64   --outfile betterprompt-$VERSION-linux-arm64
          bun build ./src/cli.ts --compile --minify --target=bun-darwin-x64    --outfile betterprompt-$VERSION-darwin-x64
          bun build ./src/cli.ts --compile --minify --target=bun-darwin-arm64  --outfile betterprompt-$VERSION-darwin-arm64
          bun build ./src/cli.ts --compile --minify --target=bun-windows-x64   --outfile betterprompt-$VERSION-windows-x64
          bun build ./src/cli.ts --compile --minify --target=bun-windows-arm64 --outfile betterprompt-$VERSION-windows-arm64

      - name: Publish to npm
        run: |
          DIST_TAG="$PRE_ID"
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --tag "$DIST_TAG" --dry-run
          else
            npm publish --tag "$DIST_TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: ${{ env.DRY_RUN == 'true' }}
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            betterprompt-${{ env.VERSION }}-linux-x64
            betterprompt-${{ env.VERSION }}-linux-arm64
            betterprompt-${{ env.VERSION }}-darwin-x64
            betterprompt-${{ env.VERSION }}-darwin-arm64
            betterprompt-${{ env.VERSION }}-windows-x64.exe
            betterprompt-${{ env.VERSION }}-windows-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version sync PR
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if main already has this version
          git checkout main
          git pull origin main
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$PKG_VERSION" = "$VERSION" ]; then
            echo "package.json already at $VERSION, skipping PR"
            exit 0
          fi

          # Check if PR already exists (idempotent re-runs)
          BRANCH="release/v$VERSION"
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists, skipping"
            exit 0
          fi

          # Create branch, bump version, push, create PR with auto-merge
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          git add package.json
          git commit -m "chore(release): v$VERSION"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore(release): v$VERSION" \
            --body "Automated version sync from release workflow." \
            --base main \
            --head "$BRANCH")

          gh pr merge "$PR_URL" --auto --squash
